name: Build Proprietary Stock GSI

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط مباشر للفيرموير (مثلاً رابط سامسونج بصيغة .zip)'
        required: true
        default: ''

jobs:
  build-proprietary-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: false
          large-storage: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MysticGSI & Dependencies
        run: |
          git clone https://github.com/Halk56855/mysticgsi.git workspace
          cd workspace
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y aria2 p7zip-full

      - name: Download Stock Firmware
        run: |
          cd workspace
          aria2c -x 16 -s 16 -o stock_firmware.zip "${{ github.event.inputs.rom_url }}"

      - name: Build Proprietary GSI
        run: |
          cd workspace
          source .venv/bin/activate
          python3 cli.py build a04_gsi stock_firmware.zip --type auto --compress

      - name: Clean and Compress Only System Image
        run: |
          cd workspace/out
          rm -f *.7z *.zip
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on final_gsi_ultra.7z *.img
          ls -lh

      - name: Upload Built Image
        uses: actions/upload-artifact@v4
        with:
          name: Proprietary-GSI-Output
          path: workspace/out/**/*
