name: Build Proprietary Stock GSI

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط مباشر للفيرموير (مثلاً رابط سامسونج بصيغة .zip)'
        required: true
        default: ''

jobs:
  build-proprietary-gsi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: false
          large-storage: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install MysticGSI & Dependencies
        run: |
          git clone https://github.com/Halk56855/mysticgsi.git workspace
          cd workspace
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y aria2 p7zip-full pigz file

      - name: Download Stock Firmware
        run: |
          cd workspace
          aria2c -x 16 -s 16 -o stock_firmware.zip "${{ github.event.inputs.rom_url }}"
          echo "=== فحص حجم ونوع الملف المحمل ==="
          ls -lh stock_firmware.zip
          file stock_firmware.zip
          SIZE_MB=$(du -m stock_firmware.zip | cut -f1)
          if [ "$SIZE_MB" -lt 500 ]; then
            echo "خطأ: الملف المحمل صغير جداً ($SIZE_MB MB)، يبدو أنه صفحة خطأ أو رابط غير مباشر وليس فيرموير حقيقي!"
            exit 1
          fi

      - name: Fix Workspace Permissions
        run: |
          sudo chown -R $USER:$USER workspace
          chmod -R 777 workspace/tmp || true

      - name: Build Proprietary GSI
        run: |
          cd workspace
          source .venv/bin/activate
          python3 cli.py build a04_gsi stock_firmware.zip --type auto --compress

      - name: Compress System Image with GZ
        run: |
          cd workspace
          find out -name "system.img" -exec pigz -9 {} \;
          find out -name "*.img" -delete || true
          find out -name "*.img.gz" -ls

      - name: Upload Built Image
        uses: actions/upload-artifact@v4
        with:
          name: Proprietary-GSI-Output
          path: workspace/out/**/*
          retention-days: 3
