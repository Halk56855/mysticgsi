name: Port OneUI to Galaxy A04

on:
  workflow_dispatch:
    inputs:
      a05s_csc:
        description: 'CSC for A05s Source (e.g., INS, XSG)'
        required: true
        default: 'XSG'
      a04_csc:
        description: 'CSC for A04 Base (e.g., INS, XSG)'
        required: true
        default: 'XSG'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 android-sdk-libsparse-utils unzip p7zip-full erofs-utils python3-pip curl git
          
          # تثبيت أداة lpunpack الرسمية للتعامل مع أقسام super.img
          sudo apt-get install -y android-tools-fsutils || true
          
          # طريقة احتياطية لتثبيت lpunpack في حال عدم توفرها في المستودع الرسمي
          if ! command -v lpunpack &> /dev/null; then
              curl -sL https://github.com/marin-m/pylpunpack/raw/master/lpunpack.py -o /usr/local/bin/lpunpack
              chmod +x /usr/local/bin/lpunpack
          fi

      - name: Install samloader-rs via Cargo
        run: |
          cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download Firmwares using samloader-rs
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          
          rm -rf workspace
          mkdir -p workspace/output
          
          MODEL_BASE="SM-A045F"
          CSC_BASE="${{ github.event.inputs.a04_csc }}"
          
          MODEL_PORT="SM-A057F"
          CSC_PORT="${{ github.event.inputs.a05s_csc }}"
          
          echo "Downloading Base Firmware ($MODEL_BASE)..."
          samloader download -m "$MODEL_BASE" -r "$CSC_BASE" -o workspace/base_firmware.zip
          
          echo "Downloading Port Firmware ($MODEL_PORT)..."
          samloader download -m "$MODEL_PORT" -r "$CSC_PORT" -o workspace/port_firmware.zip

      - name: Extract and Process Firmware
        run: |
          chmod +x tools/port.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          ./tools/port.sh
        shell: bash

      - name: Upload Port Output
        uses: actions/upload-artifact@v4
        with:
          name: Ported-ROM-A04
          path: workspace/output/*.zip
          retention-days: 3
