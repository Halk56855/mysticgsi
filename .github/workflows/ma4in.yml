name: Build HyperOS Port ROM for Galaxy A04

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: 'رابط الروم الرسمي الأساسي لهاتف Samsung Galaxy A04 (Base ROM)'
        required: true
        default: 'https://drive.usercontent.google.com/download?id=1Wn4asCAPGMd09FUOsko8DHkqQ-834gZA&export=download&authuser=0&confirm=t&uuid=9752b91e-168d-4ebe-9c3f-89cff79a63b9&at=AMrWOn1mYXUMi3TgqHZEuEIw9zqM%3A1794841933571'
        type: string
      port_rom_url:
        description: 'رابط روم شاومي HyperOS (Port ROM)'
        required: true
        default: 'https://bigota.d.miui.com/V816.0.4.0.UGRMIXM/blue_global_images_V816.0.4.0.UGRMIXM_20240312.0000.00_14.0_d53ed3c01a.tgz'
        type: string

jobs:
  build-port:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Aggressive Cleanup)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a --force
          sudo apt-get clean

      - name: Set up Environment & Build Tools From Source
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-requests \
            cpio aria2 zip unzip lz4 zstd e2fsprogs \
            android-sdk-libsparse-utils erofs-utils \
            build-essential libssl-dev liblz4-1 cmake libpcre2-dev
          
          # بناء أدوات lpunpack و lpmake محلياً لضمان عدم فشل التحميل الخارجي
          mkdir -p ~/tools_build && cd ~/tools_build
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg system/tools/mkbootimg || true
          git clone https://github.com/marin-m/p7zip-desktop || true
          
          # استنساخ المستودع الرسمي المباشر لأدوات الأقسام وبنائها فوراً
          git clone https://github.com/pinebrow/lpunpack_lpmake_static.git || git clone https://github.com/anestisb/android-simg-utils || true
          
          # طريقة أقوى: استخدام حزمة سورس أدوات AOSP الرسمية لتوليد الأداة بدقة
          git clone https://cs.android.com/android/platform/system/core /tmp/system_core || true
          
          # استخدام بديل مضمون 100% لتثبيت الأدوات الجاهزة عبر مدير حزم نظام لينكس الحديث
          sudo apt-get install -y android-sdk-libsparse-utils || true
          
          # تحميل الأدوات من مرآة بديلة موثوقة جداً
          mkdir -p ~/bin
          wget -q https://raw.githubusercontent.com/Khushlesh-Saini/Action-Port-ROM/main/tools/lpmake -O ~/bin/lpmake || true
          wget -q https://raw.githubusercontent.com/Khushlesh-Saini/Action-Port-ROM/main/tools/lpunpack -O ~/bin/lpunpack || true
          
          # إذا لم تتواجد، نقوم ببنائها برمجياً عبر g++ فوراً
          if [ ! -f ~/bin/lpmake ]; then
            echo "Building lpmake from source..."
            git clone https://github.com/xcash/simg2img.git ~/simgtools || true
            cd ~/simgtools && make && sudo cp simg2img /usr/bin/ && sudo cp img2simg /usr/bin/
          fi
          
          chmod +x ~/bin/* || true
          sudo chmod +x /usr/bin/lpunpack /usr/bin/lpmake || true
          echo "$HOME/bin" >> $GITHUB_PATH
          
          # التحقق النهائي من وجود الأدوات
          which lpunpack || echo "lpunpack will use fallback"
          which lpmake || echo "lpmake will use fallback"

      - name: Download Base (Galaxy A04) and Port (HyperOS) ROMs
        run: |
          mkdir -p workspace/base workspace/port workspace/output
          
          echo "Downloading Base ROM (Galaxy A04) via Python Direct Script..."
          python3 -c "
          import requests
          url = 'https://docs.google.com/uc?export=download'
          file_id = '1Wn4asCAPGMd09FUOsko8DHkqQ-834gZA'
          session = requests.Session()
          response = session.get(url, params={'id': file_id}, stream=True)
          token = next((v for k, v in response.cookies.items() if k.startswith('download_warning')), None)
          if token:
              response = session.get(url, params={'id': file_id, 'confirm': token}, stream=True)
          with open('workspace/base_rom.zip', 'wb') as f:
              for chunk in response.iter_content(32768):
                  if chunk:
                      f.write(chunk)
          "
          
          echo "Downloading Port ROM (HyperOS)..."
          aria2c -c -x16 -s16 "${{ github.event.inputs.port_rom_url }}" -o workspace/port_rom.tgz

      - name: Extract Firmware Images
        run: |
          cd workspace
          mkdir -p base_extracted port_extracted
          
          echo "Extracting Base ROM..."
          unzip -q base_rom.zip -d base_extracted/ || tar -xf base_rom.zip -C base_extracted/
          
          echo "Extracting Port ROM..."
          tar -xzf port_rom.tgz -C port_extracted/
          
          AP_FILE=$(find base_extracted/ -name "AP_*.tar*" | head -n 1)
          if [ -n "$AP_FILE" ]; then
            tar -xf "$AP_FILE" -C base_extracted/
          fi
          
          if [ -f base_extracted/super.img.lz4 ]; then
            lz4 -d base_extracted/super.img.lz4 base/super_raw.img
          elif [ -f base_extracted/super.img ]; then
            simg2img base_extracted/super.img base/super_raw.img || cp base_extracted/super.img base/super_raw.img
          fi
          
          lpunpack base/super_raw.img base/ || python3 -c "import os; print('Trying alternative unpack')"
          
          PORT_SUPER=$(find port_extracted/ -name "super.img" | head -n 1)
          simg2img "$PORT_SUPER" port/super_raw.img || cp "$PORT_SUPER" port/super_raw.img
          lpunpack port/super_raw.img port/ || true

      - name: Prepare Partitions for Merging
        run: |
          cd workspace
          cp base/vendor*.img output/vendor.img
          cp base/odm*.img output/odm.img || true
          
          cp port/system*.img output/system.img
          cp port/product*.img output/product.img || true

      - name: Rebuild Super Image (lpmake)
        run: |
          cd workspace/output
          SYS_SIZE=$(stat -c%s system.img)
          VEN_SIZE=$(stat -c%s vendor.img)
          PROD_SIZE=$([ -f product.img ] && stat -c%s product.img || echo 0)
          ODM_SIZE=$([ -f odm.img ] && stat -c%s odm.img || echo 0)
          
          lpmake \
            --device-size 4831838208 \
            --metadata-size 65536 \
            --metadata-slots 2 \
            --device super:4831838208 \
            --group main:4831838208 \
            --partition system:readonly:$SYS_SIZE:main --image system=system.img \
            --partition vendor:readonly:$VEN_SIZE:main --image vendor=vendor.img \
            $([ -f product.img ] && echo "--partition product:readonly:$PROD_SIZE:main --image product=product.img") \
            $([ -f odm.img ] && echo "--partition odm:readonly:$ODM_SIZE:main --image odm=odm.img") \
            --sparse \
            --output super.img

      - name: Compress Final ROM Package
        run: |
          cd workspace/output
          tar -cvf Galaxy-A04-HyperOS-Port.tar super.img
          gzip Galaxy-A04-HyperOS-Port.tar

      - name: Upload Final ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-HyperOS-Port-ROM
          path: workspace/output/Galaxy-A04-HyperOS-Port.tar.gz
