name: Full Port ROM Builder for Galaxy A04 (HyperOS / Android 14)

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: 'رابط تحميل الروم الرسمي الأساسي لهاتف A04 (Base ROM .zip/.tar)'
        required: true
        type: string
      port_rom_url:
        description: 'رابط تحميل الروم المنقول (Port ROM - HyperOS)'
        required: true
        default: 'https://bigota.d.miui.com/V816.0.4.0.UGRMIXM/blue_global_images_V816.0.4.0.UGRMIXM_20240312.0000.00_14.0_d53ed3c01a.tgz'
        type: string

jobs:
  build-port:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set up Environment & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip \
            cpio aria2 zip unzip lz4 zstd e2fsprogs \
            build-essential libssl-dev liblz4-tool
          
          # تثبيت أدوات فك وتجميع الأقسام الديناميكية
          git clone https://github.com/AndroidPorting/PortTools.git ~/PortTools
          chmod +x ~/PortTools/*.sh

      - name: Download ROMs (Base & Port)
        run: |
          mkdir -p workspace/base workspace/port workspace/output
          
          echo "Downloading Base ROM (Galaxy A04)..."
          aria2c -c -x16 -s16 "${{ github.event.inputs.base_rom_url }}" -o workspace/base_rom.zip
          
          echo "Downloading Port ROM (HyperOS)..."
          aria2c -c -x16 -s16 "${{ github.event.inputs.port_rom_url }}" -o workspace/port_rom.tgz

      - name: Extract Firmware Images
        run: |
          cd workspace
          echo "Extracting Base and Port ROM files..."
          mkdir -p base_extracted port_extracted
          
          # فك ضغط الرومات بناءً على صيغتها
          unzip -q base_rom.zip -d base_extracted/ || tar -xf base_rom.zip -C base_extracted/
          tar -xzf port_rom.tgz -C port_extracted/ || unzip -q port_rom.tgz -d port_extracted/
          
          # تشغيل سكريبت الاستخراج للأقسام
          python3 ~/PortTools/extract.py base_extracted/ base/
          python3 ~/PortTools/extract.py port_extracted/ port/

      - name: Process and Merge Port to Base
        run: |
          cd workspace
          echo "Merging Vendor/Boot (A04) with System (HyperOS)..."
          
          python3 ~/PortTools/merge.py \
            --base base/ \
            --port port/ \
            --output output/ \
            --device "A045F"

      - name: Rebuild Super Image (lpmake)
        run: |
          cd workspace/output
          echo "Rebuilding super.img for Galaxy A04 partition limits..."
          
          # إعادة تجميع الأقسام بالحجم المخصص لهاتف A04 (حد أقصى 4.2GB)
          ~/PortTools/lpmake \
            --device-size 4294967296 \
            --metadata-size 65536 \
            --metadata-slots 3 \
            --device super:3221225472 \
            --group main_group:3221225472 \
            --partition system:readonly:2147483648:main_group \
            --partition vendor:readonly:1073741824:main_group \
            --output super.img

      - name: Compress Final ROM Package
        run: |
          cd workspace/output
          tar -cvf Galaxy-A04-HyperOS-Port.tar super.img
          gzip Galaxy-A04-HyperOS-Port.tar

      - name: Upload Final ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-HyperOS-Port-ROM
          path: workspace/output/Galaxy-A04-HyperOS-Port.tar.gz
