name: Build HyperOS Port ROM for Galaxy A04 (Bypass Drive Virus Warning)

on:
  workflow_dispatch:
    inputs:
      samsung_model:
        description: 'موديل هاتف سامسونج'
        required: true
        default: 'SM-A045F'
        type: string
      samsung_csc:
        description: 'رمز المنطقة (CSC) مثل XSG أو EGY'
        required: true
        default: 'XSG'
        type: string
      port_rom_url:
        description: 'رابط Google Drive المباشر لروم شاومي HyperOS'
        required: true
        default: 'https://drive.google.com/file/d/1m-RU5Xsib6C62YkHkxVwDvRotwkcIWz6/view'
        type: string

jobs:
  build-port:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune -a --force
          sudo apt-get clean

      - name: Set up Environment & Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip python3-requests \
            cpio aria2 axel zip unzip lz4 zstd e2fsprogs \
            android-sdk-libsparse-utils erofs-utils file \
            build-essential libssl-dev liblz4-1 pkg-config
          
          # تثبيت لغة Rust و samloader-rs لتحميل روم سامسونج
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader
          
          # تجهيز أدوات الأقسام (lpmake و lpunpack)
          mkdir -p ~/bin
          git clone --depth=1 https://github.com/whyshhnuv/lpunpack-lpmake-mirror.git /tmp/lpbinary || \
          git clone --depth=1 https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git /tmp/lpbinary
          
          if [ -d "/tmp/lpbinary/binary" ]; then
            cp /tmp/lpbinary/binary/* ~/bin/
          else
            find /tmp/lpbinary -name "lpmake" -o -name "lpunpack" -exec cp {} ~/bin/ \;
          fi
          
          chmod +x ~/bin/*
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download Base ROM (Samsung)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p workspace/base workspace/port workspace/output
          cd workspace
          
          MODEL="${{ github.event.inputs.samsung_model }}"
          CSC="${{ github.event.inputs.samsung_csc }}"
          
          echo "Downloading Samsung firmware using samloader-rs..."
          samloader download -m "$MODEL" -r "$CSC" -o base_rom.zip || samloader download --model "$MODEL" --region "$CSC" -o base_rom.zip

      - name: Download Port ROM from Google Drive (Bypass Virus Warning)
        run: |
          cd workspace
          ROM_URL="${{ github.event.inputs.port_rom_url }}"
          
          # استخراج معرّف الملف (File ID) من الرابط تلقائياً
          FILE_ID=$(echo "$ROM_URL" | grep -oP '(?<=/d/)[^/]+' || echo "$ROM_URL" | grep -oP '(?<=id=)[^&]+')
          echo "Extracted Google Drive File ID: $FILE_ID"
          
          echo "Downloading large file via curl with confirmation cookie bypass..."
          # استخدام أداة curl مع جلسة وهمية لتخطي صفحة تحذير الحجم والفيروسات
          URL="https://drive.google.com/uc?export=download&id=$FILE_ID"
          
          CONFIRM=$(wget --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate -qO- "$URL" | grep -oP 'confirm=[a-zA-Z0-9_-]+' || true)
          if [ -n "$CONFIRM" ]; then
            echo "Bypassing virus warning confirmation token..."
            wget --load-cookies /tmp/cookies.txt "https://drive.google.com/uc?export=download&confirm=$CONFIRM&id=$FILE_ID" -O port_rom_archive
          else
            wget --load-cookies /tmp/cookies.txt "$URL" -O port_rom_archive
          fi
          
          ls -lh port_rom_archive
          file port_rom_archive

      - name: Extract, Convert and Unpack super.img for Both Base and Port ROMs
        run: |
          export PATH="$HOME/bin:$PATH"
          cd workspace
          mkdir -p base_extracted port_extracted base_unpacked port_unpacked output
          
          echo "=== 1. Extracting Samsung Base ROM ==="
          unzip -q base_rom.zip -d base_extracted/ || tar -xf base_rom.zip -C base_extracted/
          AP_FILE=$(find base_extracted/ -name "AP_*.tar*" | head -n 1)
          if [ -n "$AP_FILE" ]; then
            echo "Found AP tar: $AP_FILE, extracting..."
            tar -xf "$AP_FILE" -C base_extracted/
          fi
          
          BASE_SUPER_LZ4=$(find base_extracted/ -name "super.img.lz4" | head -n 1)
          BASE_SUPER=$(find base_extracted/ -name "super.img" | head -n 1)
          
          if [ -f "$BASE_SUPER_LZ4" ]; then
            echo "Decompressing Samsung super.img.lz4..."
            lz4 -d "$BASE_SUPER_LZ4" base_super_temp.img
            rm -f "$BASE_SUPER_LZ4"
          elif [ -f "$BASE_SUPER" ]; then
            mv "$BASE_SUPER" base_super_temp.img
          else
            echo "Error: Samsung super.img not found!"
            exit 1
          fi
          
          echo "Checking Samsung super image format: $(file base_super_temp.img)"
          if file base_super_temp.img | grep -qi "sparse"; then
            echo "Converting Sparse image to Raw via simg2img..."
            simg2img base_super_temp.img base_super_raw.img
            rm -f base_super_temp.img
          else
            mv base_super_temp.img base_super_raw.img
          fi
          
          echo "=== Unpacking Samsung Base super.img ==="
          lpunpack base_super_raw.img base_unpacked/
          ls -lh base_unpacked/
          rm -f base_super_raw.img
          
          if [ ! -f "base_unpacked/vendor.img" ]; then
            echo "Error: lpunpack failed to extract vendor.img from Samsung super!"
            exit 1
          fi
          
          echo "=== 2. Extracting Xiaomi HyperOS Port ROM ==="
          if file port_rom_archive | grep -qi "gzip"; then
            tar -xzf port_rom_archive -C port_extracted/
          elif file port_rom_archive | grep -qi "Zip"; then
            unzip -q port_rom_archive -d port_extracted/
          elif file port_rom_archive | grep -qi "POSIX tar"; then
            tar -xf port_rom_archive -C port_extracted/
          else
            echo "Error: Downloaded file is not a valid archive! Check if Google Drive returned an HTML page."
            head -n 20 port_rom_archive
            exit 1
          fi
          rm -f port_rom_archive
          
          PORT_SUPER=$(find port_extracted/ -name "super.img" | head -n 1)
          if [ -f "$PORT_SUPER" ]; then
            echo "Checking Xiaomi super image format: $(file "$PORT_SUPER")"
            if file "$PORT_SUPER" | grep -qi "sparse"; then
              simg2img "$PORT_SUPER" port_super_raw.img
            else
              mv "$PORT_SUPER" port_super_raw.img
            fi
          else
            echo "Error: Xiaomi super.img not found in Port ROM!"
            find port_extracted/ -maxdepth 3
            exit 1
          fi
          
          echo "=== Unpacking Xiaomi HyperOS super.img ==="
          lpunpack port_super_raw.img port_unpacked/
          ls -lh port_unpacked/
          rm -f port_super_raw.img
          
          if [ ! -f "port_unpacked/system.img" ]; then
            echo "Error: lpunpack failed to extract system.img from Xiaomi super!"
            exit 1
          fi

      - name: Prepare Partitions for Merging
        run: |
          cd workspace
          mkdir -p output
          
          echo "Copying required partitions..."
          cp base_unpacked/vendor.img output/vendor.img
          cp base_unpacked/odm.img output/odm.img || true
          cp base_unpacked/system_ext.img output/system_ext.img || true
          
          cp port_unpacked/system.img output/system.img
          cp port_unpacked/product.img output/product.img || true
          
          rm -rf base_extracted port_extracted base_unpacked port_unpacked
          ls -lh output/

      - name: Rebuild Super Image (lpmake)
        run: |
          export PATH="$HOME/bin:$PATH"
          cd workspace/output
          SYS_SIZE=$(stat -c%s system.img)
          VEN_SIZE=$(stat -c%s vendor.img)
          PROD_SIZE=$([ -f product.img ] && stat -c%s product.img || echo 0)
          ODM_SIZE=$([ -f odm.img ] && stat -c%s odm.img || echo 0)
          SYS_EXT_SIZE=$([ -f system_ext.img ] && stat -c%s system_ext.img || echo 0)
          
          lpmake \
            --device-size 4831838208 \
            --metadata-size 65536 \
            --metadata-slots 2 \
            --device super:4831838208 \
            --group main:4831838208 \
            --partition system:readonly:$SYS_SIZE:main --image system=system.img \
            --partition vendor:readonly:$VEN_SIZE:main --image vendor=vendor.img \
            $([ -f product.img ] && echo "--partition product:readonly:$PROD_SIZE:main --image product=product.img") \
            $([ -f odm.img ] && echo "--partition odm:readonly:$ODM_SIZE:main --image odm=odm.img") \
            $([ -f system_ext.img ] && echo "--partition system_ext:readonly:$SYS_EXT_SIZE:main --image system_ext=system_ext.img") \
            --sparse \
            --output super.img

      - name: Compress Final ROM Package
        run: |
          cd workspace/output
          tar -cvf Galaxy-A04-HyperOS-Port.tar super.img
          gzip Galaxy-A04-HyperOS-Port.tar

      - name: Upload Final ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-HyperOS-Port-ROM
          path: workspace/output/Galaxy-A04-HyperOS-Port.tar.gz
