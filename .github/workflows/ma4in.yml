name: Build HyperOS Port ROM for Galaxy A04 (Complete & Final)

on:
  workflow_dispatch:
    inputs:
      samsung_model:
        description: 'موديل هاتف سامسونج'
        required: true
        default: 'SM-A045F'
        type: string
      samsung_csc:
        description: 'رمز المنطقة (CSC) مثل XSG أو EGY'
        required: true
        default: 'XSG'
        type: string
      port_rom_url:
        description: 'رابط روم شاومي HyperOS (Port ROM)'
        required: true
        default: 'https://bigota.d.miui.com/V816.0.4.0.UGRMIXM/blue_global_images_V816.0.4.0.UGRMIXM_20240312.0000.00_14.0_d53ed3c01a.tgz'
        type: string

jobs:
  build-port:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune -a --force
          sudo apt-get clean

      - name: Set up Environment & Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-requests \
            cpio aria2 axel zip unzip lz4 zstd e2fsprogs \
            android-sdk-libsparse-utils erofs-utils \
            build-essential libssl-dev liblz4-1 pkg-config
          
          # تثبيت لغة Rust و samloader-rs لتحميل روم سامسونج
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader
          
          # تجهيز أدوات الأقسام
          mkdir -p ~/bin
          wget -q https://raw.githubusercontent.com/Khushlesh-Saini/Action-Port-ROM/main/tools/lpmake -O ~/bin/lpmake || true
          wget -q https://raw.githubusercontent.com/Khushlesh-Saini/Action-Port-ROM/main/tools/lpunpack -O ~/bin/lpunpack || true
          chmod +x ~/bin/*
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download Base ROM (Samsung)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p workspace/base workspace/port workspace/output
          cd workspace
          
          MODEL="${{ github.event.inputs.samsung_model }}"
          CSC="${{ github.event.inputs.samsung_csc }}"
          
          echo "Downloading Samsung firmware using samloader-rs..."
          samloader download -m "$MODEL" -r "$CSC" -o base_rom.zip || samloader download --model "$MODEL" --region "$CSC" -o base_rom.zip

      - name: Download Port ROM (HyperOS) with Axel Accelerator
        run: |
          cd workspace
          echo "Downloading Port ROM (HyperOS) using Axel..."
          axel -n 32 -o port_rom.tgz "${{ github.event.inputs.port_rom_url }}" || aria2c -c -x16 -s16 "${{ github.event.inputs.port_rom_url }}" -o port_rom.tgz

      - name: Extract Firmware Images
        run: |
          cd workspace
          mkdir -p base_extracted port_extracted base port output
          
          echo "Extracting Base ROM (Samsung)..."
          unzip -q base_rom.zip -d base_extracted/ || tar -xf base_rom.zip -C base_extracted/
          
          AP_FILE=$(find base_extracted/ -name "AP_*.tar*" | head -n 1)
          if [ -n "$AP_FILE" ]; then
            echo "Extracting AP tar: $AP_FILE"
            tar -xf "$AP_FILE" -C base_extracted/
          fi
          
          # استخراج super.img الأساسي وفكه لتوليد vendor.img و odm.img وغيرها
          BASE_SUPER=$(find base_extracted/ -name "super.img" | head -n 1)
          if [ -f "$BASE_SUPER" ]; then
            simg2img "$BASE_SUPER" base/super_raw.img || cp "$BASE_SUPER" base/super_raw.img
          else
            BASE_SUPER_LZ4=$(find base_extracted/ -name "super.img.lz4" | head -n 1)
            lz4 -d "$BASE_SUPER_LZ4" base/super_raw.img
          fi
          
          echo "Unpacking Base super.img..."
          lpunpack base/super_raw.img base/
          
          echo "Extracting Port ROM (HyperOS)..."
          tar -xzf port_rom.tgz -C port_extracted/
          PORT_SUPER=$(find port_extracted/ -name "super.img" | head -n 1)
          simg2img "$PORT_SUPER" port/super_raw.img || cp "$PORT_SUPER" port/super_raw.img
          lpunpack port/super_raw.img port/

      - name: Prepare Partitions for Merging
        run: |
          cd workspace
          echo "Copying vendor/odm from base and system/product from port..."
          
          cp base/vendor.img output/vendor.img
          cp base/odm.img output/odm.img || true
          
          cp port/system.img output/system.img
          cp port/product.img output/product.img || true
          
          ls -lh output/

      - name: Rebuild Super Image (lpmake)
        run: |
          cd workspace/output
          SYS_SIZE=$(stat -c%s system.img)
          VEN_SIZE=$(stat -c%s vendor.img)
          PROD_SIZE=$([ -f product.img ] && stat -c%s product.img || echo 0)
          ODM_SIZE=$([ -f odm.img ] && stat -c%s odm.img || echo 0)
          
          lpmake \
            --device-size 4831838208 \
            --metadata-size 65536 \
            --metadata-slots 2 \
            --device super:4831838208 \
            --group main:4831838208 \
            --partition system:readonly:$SYS_SIZE:main --image system=system.img \
            --partition vendor:readonly:$VEN_SIZE:main --image vendor=vendor.img \
            $([ -f product.img ] && echo "--partition product:readonly:$PROD_SIZE:main --image product=product.img") \
            $([ -f odm.img ] && echo "--partition odm:readonly:$ODM_SIZE:main --image odm=odm.img") \
            --sparse \
            --output super.img

      - name: Compress Final ROM Package
        run: |
          cd workspace/output
          tar -cvf Galaxy-A04-HyperOS-Port.tar super.img
          gzip Galaxy-A04-HyperOS-Port.tar

      - name: Upload Final ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-HyperOS-Port-ROM
          path: workspace/output/Galaxy-A04-HyperOS-Port.tar.gz
