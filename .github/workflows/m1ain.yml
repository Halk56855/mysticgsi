name: Build Non-Android Linux OS (Halium)

on:
  workflow_dispatch:

jobs:
  build-linux-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y repo git bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf libxml2-utils zip zlib1g-dev python3-pip python3-yaml
          pip3 install --user pyyaml

      - name: Configure Git Identity
        run: |
          git config --global user.name "Halium Builder"
          git config --global user.email "builder@halium.org"

      - name: Initialize Repo and Add Device Manifest
        run: |
          mkdir halium && cd halium
          repo init -u https://github.com/Halium/android -b halium-12.0 --depth=1
          
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Halk56855/android_device_samsung_a04-lineage" path="device/samsung/a04" remote="github" revision="main" />
            <project name="Halk56855/android_kernel_samsung_a045" path="kernel/samsung/a045" remote="github" revision="main" />
            <project name="DaniHasReal/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="main" />
            <project name="DaniHasReal/lineage-keys" path="lineage-keys" remote="github" revision="main" />
          </manifest>
          EOF
          
          repo sync -c -j$(nproc) --no-clone-bundle --optimized-fetch --prune

      - name: Precise Python Parser to Clean Vendor Android.bp
        run: |
          cd halium
          rm -rf device/google/cuttlefish
          rm -rf device/google/cuttlefish_prebuilts
          rm -rf packages/modules/Virtualization
          
          # سكريبت بايثون دقيق لإزالة مكتبة libacdk والوحدات السابقة المعطوبة
          python3 - << 'EOF'
          import os

          bp_path = "vendor/samsung/a04/Android.bp"
          if os.path.exists(bp_path):
              with open(bp_path, "r", encoding="utf-8") as f:
                  text = f.read()

              target_modules = [
                  "tzdaemon",
                  "tzts_daemon",
                  "libstagefright_aidl_bufferpool2",
                  "vendor.samsung.hardware.hyper-service",
                  "libminiui",
                  "libclearkeycasplugin",
                  "libwvdrmengine",
                  "libsec-ril",
                  "vendor.mediatek.hardware.mtkpower@1.0-service",
                  "libwvhidl",
                  "android.hardware.drm@1.4-service.clearkey",
                  "android.hardware.drm@1.4-service.widevine",
                  "factory",
                  "libacdk"
              ]

              for mod in target_modules:
                  patterns = [f'name: "{mod}"', f"name: '{mod}'"]
                  for pattern in patterns:
                      while pattern in text:
                          idx = text.find(pattern)
                          start_brace = text.rfind('{', 0, idx)
                          if start_brace == -1:
                              break
                          
                          line_start = text.rfind('\n', 0, start_brace) + 1
                          
                          depth = 0
                          end_idx = -1
                          for j in range(start_brace, len(text)):
                              if text[j] == '{':
                                  depth += 1
                              elif text[j] == '}':
                                  depth -= 1
                                  if depth == 0:
                                      end_idx = j + 1
                                      break
                          
                          if end_idx != -1:
                              text = text[:line_start] + text[end_idx:]
                          else:
                              break

              with open(bp_path, "w", encoding="utf-8") as f:
                  f.write(text)
              print("Successfully purged libacdk and other conflicting modules.")
          EOF

      - name: Build System Image
        run: |
          cd halium
          source build/envsetup.sh
          lunch lineage_a04-userdebug
          mka systemimage
