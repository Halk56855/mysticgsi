name: Build Non-Android Linux OS (Halium 14)

on:
  workflow_dispatch:

jobs:
  build-linux-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extreme Disk Space Cleanup & Setup Swap
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h

          echo "Removing heavy preinstalled packages and caches..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/az
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /var/lib/apt/lists/*
          
          sudo docker image prune --all --force
          sudo apt-get clean

          echo "=== AFTER CLEANUP ==="
          df -h

          echo "Setting up 16GB Swap safely..."
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y repo git bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf libxml2-utils zip zlib1g-dev python3-pip python3-yaml
          pip3 install --user pyyaml

      - name: Configure Git Identity
        run: |
          git config --global user.name "Halium Builder"
          git config --global user.email "builder@halium.org"

      - name: Initialize Repo and Add Device Manifest (Proper Integration)
        run: |
          mkdir halium && cd halium
          repo init -u https://github.com/Halium/android -b halium-14.0 --depth=1
          
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- تعريف شجرة الجهاز والنواة والمورد مباشرة في الـ manifest لضمان قراءة ملفات الـ lunch والـ vendorsetup -->
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            
            <!-- إزالة ومحاربة المجلدات الثقيلة لتوفير مساحة القرص -->
            <remove-project name="platform/prebuilts/rust" />
            <remove-project name="platform/prebuilts/clang/host/linux-x86" />
          </manifest>
          EOF
          
          repo sync -c -j4 --no-clone-bundle --optimized-fetch --prune --no-tags

      - name: Fast & Precise Python Parser to Clean Vendor and System Android.bp
        run: |
          cd halium
          rm -rf device/google/cuttlefish
          rm -rf device/google/cuttlefish_prebuilts
          rm -rf packages/modules/Virtualization
          
          python3 - << 'EOF'
          import os, glob, re

          bp_path = "vendor/samsung/a04/Android.bp"
          if os.path.exists(bp_path):
              with open(bp_path, "r", encoding="utf-8") as f:
                  text = f.read()

              target_modules = [
                  "tzdaemon", "tzts_daemon", "libstagefright_aidl_bufferpool2",
                  "vendor.samsung.hardware.hyper-service", "libminiui", "libclearkeycasplugin",
                  "libwvdrmengine", "libsec-ril", "vendor.mediatek.hardware.mtkpower@1.0-service",
                  "libwvhidl", "android.hardware.drm@1.4-service.clearkey",
                  "android.hardware.drm@1.4-service.widevine", "factory", "libacdk",
                  "libPVRMtkutils", "libsrv_um", "libusc", "libglslcompiler",
                  "libmemtrack_GL", "libufwriter", "memtrack.default",
                  "android.hardware.graphics.allocator@4.0-service-mediatek",
                  "libPVROCL", "gralloc.rogue", "libIMGegl", "libEGL_mtk",
                  "libGLESv1_CM_mtk", "vulkan.mt6765", "libGLESv2_mtk",
                  "audio_common-aidl-cpp", "audioclient-types-aidl-cpp"
              ]

              for mod in target_modules:
                  patterns = [f'name: "{mod}"', f"name: '{mod}'"]
                  for pattern in patterns:
                      while pattern in text:
                          idx = text.find(pattern)
                          start_brace = text.rfind('{', 0, idx)
                          if start_brace == -1:
                              break
                          line_start = text.rfind('\n', 0, start_brace) + 1
                          depth = 0
                          end_idx = -1
                          for j in range(start_brace, len(text)):
                              if text[j] == '{':
                                  depth += 1
                              elif text[j] == '}':
                                  depth -= 1
                                  if depth == 0:
                                      end_idx = j + 1
                                      break
                          if end_idx != -1:
                              text = text[:line_start] + text[end_idx:]
                          else:
                              break

              with open(bp_path, "w", encoding="utf-8") as f:
                  f.write(text)

          search_dirs = ["vendor", "device", "external/e2fsprogs"]
          for s_dir in search_dirs:
              for bp_file in glob.glob(f"{s_dir}/**/Android.bp", recursive=True):
                  try:
                      with open(bp_file, "r", encoding="utf-8") as f:
                          content = f.read()
                      if "com.android.virt" in content:
                          content = re.sub(r',\s*"com.android.virt"', '', content)
                          content = re.sub(r'"com.android.virt"\s*,', '', content)
                          content = re.sub(r'"com.android.virt"', '', content)
                          with open(bp_file, "w", encoding="utf-8") as f:
                              f.write(content)
                  except Exception as e:
                      pass
          EOF

      - name: Build System Image (Halium 14)
        run: |
          cd halium
          source build/envsetup.sh
          lunch lineage_a04-userdebug
          mka -j4 systemimage
