name: Build Non-Android Linux OS (Halium)

on:
  workflow_dispatch:

jobs:
  build-linux-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y repo git bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf libxml2-utils zip zlib1g-dev python3-pip python3-yaml
          pip3 install --user pyyaml

      - name: Configure Git Identity
        run: |
          git config --global user.name "Halium Builder"
          git config --global user.email "builder@halium.org"

      - name: Initialize Repo and Add Device Manifest
        run: |
          mkdir halium && cd halium
          repo init -u https://github.com/Halium/android -b halium-12.0 --depth=1
          
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Halk56855/android_device_samsung_a04-lineage" path="device/samsung/a04" remote="github" revision="main" />
            <project name="Halk56855/android_kernel_samsung_a045" path="kernel/samsung/a045" remote="github" revision="main" />
            <project name="DaniHasReal/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="main" />
            <project name="DaniHasReal/lineage-keys" path="lineage-keys" remote="github" revision="main" />
          </manifest>
          EOF
          
          repo sync -c -j$(nproc) --no-clone-bundle --optimized-fetch --prune

      - name: Clean Vendor Android.bp Safely
        run: |
          cd halium
          rm -rf device/google/cuttlefish
          rm -rf device/google/cuttlefish_prebuilts
          rm -rf packages/modules/Virtualization
          
          # سكريبت بايثون محسن للبحث عن الوحدات وإزالتها بالكامل مع أقواسها دون ترك فواصل عائمة
          python3 - << 'EOF'
          import os

          bp_path = "vendor/samsung/a04/Android.bp"
          if os.path.exists(bp_path):
              with open(bp_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              keywords = [
                  "tzdaemon", 
                  "tzts_daemon", 
                  "libstagefright_aidl_bufferpool2", 
                  "vendor.samsung.hardware.hyper-service", 
                  "libminiui",
                  "clearkeycasplugin",
                  "wvdrmengine"
              ]
              
              new_lines = []
              skip = False
              brace_count = 0
              
              for line in lines:
                  if not skip:
                      if any(kw in line for kw in keywords) and ("name:" in line or "cc_prebuilt_library" in line or "android_app" in line or "cc_binary" in line):
                          skip = True
                          brace_count = line.count('{') - line.count('}')
                          # إزالة السطر الحالي أيضاً إذا بدأ تعريف الوحدة
                          continue
                      new_lines.append(line)
                  else:
                      brace_count += line.count('{') - line.count('}')
                      if brace_count <= 0:
                          skip = False

              with open(bp_path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
              print("Successfully cleaned Android.bp lines cleanly.")
          EOF

      - name: Build System Image
        run: |
          cd halium
          source build/envsetup.sh
          lunch lineage_a04-userdebug
          mka systemimage
