name: Build Halium 14 for Samsung A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 16384
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3 python-is-python3 bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Init Repo & Sync Halium 14.0 (on /mnt)
        run: |
          sudo mkdir -p /mnt/halium-14
          sudo chown -R $USER:$USER /mnt/halium-14
          cd /mnt/halium-14
          repo init -u https://github.com/Halium/android.git -b halium-14.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device, Vendor, and Kernel Repositories
        run: |
          cd /mnt/halium-14
          git clone https://github.com/juanes10201/android_device_samsung_a04.git device/samsung/a04
          git clone https://github.com/juanes10201/android_vendor_samsung_a04.git vendor/samsung/a04
          git clone https://github.com/juanes10201/kernel-samsung-a04.git kernel/samsung/a04

      - name: Apply Hybris Patches
        run: |
          cd /mnt/halium-14
          git clone https://github.com/Halium/hybris-patches.git
          cd hybris-patches
          ./apply-patches.sh --mb
          cd ..

      - name: Start Compilation
        run: |
          cd /mnt/halium-14
          source build/envsetup.sh
          breakfast a04
          mka halium-boot
          mka systemimage

      - name: Upload Output Images
        uses: actions/upload-artifact@v4
        with:
          name: halium-samsung-a04-images
          path: |
            /mnt/halium-14/out/target/product/a04/halium-boot.img
            /mnt/halium-14/out/target/product/a04/system.img
