name: Convert XGSI for Galaxy A04 (Direct Image Flash)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'رابط التحميل المباشر من Pixeldrain'
        required: true
        default: 'https://pixeldrain.com/api/file/mMTbBQQw?download'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: 2. Install Required Tools
        run: |
          sudo apt update && sudo apt install -y p7zip-full zip unzip wget git file curl

      - name: 3. Download and Extract system.img
        run: |
          mkdir -p work/extracted
          cd work
          wget -O rom.zip "${{ github.event.inputs.download_url }}"
          7z x rom.zip -oextracted -y
          rm -f rom.zip

      - name: 4. Prepare Direct Flashable Package
        run: |
          mkdir -p work/flashable/META-INF/com/google/android
          
          # استخراج ملف system.img الأصلي مباشرة
          SYS_IMG=$(find work/extracted -type f -name "system.img" | head -n 1)
          if [ -z "$SYS_IMG" ]; then
            echo "Error: system.img not found!"
            exit 1
          fi

          mv "$SYS_IMG" work/flashable/system.img

          # كتابة سكريبت تفليش مباشر ومبسط يتجاوز مشاكل الـ Unzip ويعتمد على تفليش الصورة مباشرة
          cat << 'EOF' > work/flashable/META-INF/com/google/android/updater-script
          ui_print("========================================");
          ui_print("  Direct Flashing system.img for A04    ");
          ui_print("========================================");
          ui_print("Unmounting system...");
          run_program("/sbin/sh", "-c", "umount /system_root || umount /system || true");
          ui_print("Flashing system.img directly to block...");
          package_extract_file("system.img", "/dev/block/mapper/system");
          ui_print("Flashing completed successfully!");
          ui_print("Please wipe data/factory reset if needed.");
          EOF

          # تحميل update-binary موثوق ومتوافق
          wget -O work/flashable/META-INF/com/google/android/update-binary https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/META-INF/com/google/android/update-binary

      - name: 5. Pack to ZIP and Split for GitHub Limit
        run: |
          cd work/flashable
          # ضغط مباشر بضغط عادي ومتوافق مع الريكفري
          zip -r9 ../XGSI_GalaxyA04_Direct.zip system.img META-INF
          cd ..
          rm -rf flashable extracted
          
          # ضغط وتقسيم بـ 7z لتجاوز حد الـ 2 جيجابايت للرفع في Releases
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on -v1900m XGSI_GalaxyA04_Direct.7z XGSI_GalaxyA04_Direct.zip
          rm -f XGSI_GalaxyA04_Direct.zip
          ls -lh XGSI_GalaxyA04_Direct.7z.*

      - name: 6. Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-a04-direct-${{ github.run_number }}
          name: "XGSI Galaxy A04 Direct Flash (${{ github.run_number }})"
          files: work/XGSI_GalaxyA04_Direct.7z.*
